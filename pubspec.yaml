name: lipslink
description: LipsLink - Lip Reading Assistant App for speech-impaired individuals
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State Management
  flutter_riverpod: ^2.5.0

  # Camera + ML Kit Face Detection (Real-time lip tracking)
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.14.0

  # Text-to-Speech
  flutter_tts: ^4.0.2

  # Local Storage
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0

  # Image Picker
  image_picker: ^1.1.2

  # Animations
  flutter_animate: ^4.5.0

  # Icons / Assets
  cupertino_icons: ^1.0.8

  # Google Fonts (replaces manual font assets)
  google_fonts: ^8.2.1

  # Crypto for password hashing
  crypto: ^3.0.3

  # UUID
  uuid: ^4.4.0

  # Intl
  intl: ^0.20.2
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  firebase_storage: ^13.4.6
  firebase_data_connect: ^0.3.2
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.2.0
  http: ^1.2.0
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/

